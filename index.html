<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭菜谱生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#4CAF50;--primary-dark:#388E3C;--primary-light:#C8E6C9;--bg:#F5F5F5;--white:#fff;--text:#333;--text-light:#666;--border:#E0E0E0;--shadow:0 2px 8px rgba(0,0,0,0.1);--radius:12px}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.container{max-width:600px;margin:0 auto;padding:15px}
.header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:var(--white);padding:20px;border-radius:var(--radius);margin-bottom:15px;text-align:center}
.header h1{font-size:1.5em;margin-bottom:5px}
.card{background:var(--white);border-radius:var(--radius);padding:20px;margin-bottom:15px;box-shadow:var(--shadow)}
.card h2{font-size:1.2em;color:var(--primary);margin-bottom:15px;padding-bottom:10px;border-bottom:2px solid var(--primary-light)}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-weight:500;margin-bottom:4px;font-size:0.95em}
.form-group input,.form-group select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:1em}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:var(--radius);cursor:pointer;font-size:1em;font-weight:500;background:var(--primary);color:var(--white)}
.btn:hover{background:var(--primary-dark)}
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:15px}
.tab{flex:1;padding:10px;text-align:center;cursor:pointer;border-bottom:3px solid transparent;font-size:0.95em}
.tab.active{border-bottom-color:var(--primary);color:var(--primary);font-weight:600}
.collapse-header{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg);border-radius:8px;cursor:pointer;margin-bottom:12px}
.collapse-header:hover{background:#eee}
.collapse-title{font-weight:600}
.collapse-icon{font-size:1.2em}
.collapse-content{display:none}
.collapse-content.open{display:block}
.bmi-display{display:flex;gap:10px;margin-top:12px;padding:10px;background:#f5f5f5;border-radius:8px}
.bmi-item{flex:1;text-align:center}
.bmi-value{font-size:1.1em;font-weight:600;color:var(--primary)}
.bmi-label{font-size:0.8em;color:var(--text-light)}
.training-check{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.training-check label{display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--bg);border-radius:6px;font-size:0.9em;cursor:pointer}
.training-check label.checked{background:var(--primary-light);color:var(--primary-dark)}
.checkbox-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.checkbox-item{display:flex;align-items:center;gap:4px;padding:6px 10px;background:#e3f2fd;border-radius:6px;font-size:0.9em;cursor:pointer}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fav-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fav-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:#e3f2fd;border-radius:15px;font-size:0.9em}
.fav-tag button{background:none;border:none;color:#f44336;cursor:pointer;padding:0;font-size:1em}
.add-fav{display:flex;gap:8px;margin-top:8px}
.add-fav input{flex:1;padding:8px;border:1px solid var(--border);border-radius:6px}
.add-fav button{padding:8px 12px;background:var(--primary);color:white;border:none;border-radius:6px;cursor:pointer}
.recipe-day{margin-bottom:15px;padding:15px;background:var(--white);border-radius:12px;box-shadow:var(--shadow)}
.day-title{font-size:1.1em;font-weight:600;color:var(--primary);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.recipe-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg);border-radius:8px;margin-bottom:6px}
.recipe-item .name{font-weight:500}
.recipe-item .nutri{font-size:0.85em;color:var(--text-light)}
.recipe-item .protein{color:var(--primary);font-weight:600}
.protein-tag{color:var(--primary);font-weight:600}
.training-badge{display:inline-block;padding:4px 10px;background:linear-gradient(135deg,#FF6B6B,#EE5A5A);color:white;border-radius:12px;font-size:0.8em;margin-left:8px}
.nutrition-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.nutrition-item{text-align:center;padding:12px;background:var(--bg);border-radius:8px}
.nutrition-item .value{font-size:1.5em;font-weight:700;color:var(--primary)}
.shopping-category{margin-bottom:15px}
.shopping-category h3{color:var(--primary);margin-bottom:8px;font-size:1em}
.shopping-item{display:flex;justify-content:space-between;padding:6px 0;font-size:0.95em}
.meal-section{margin-bottom:12px}
.meal-title{font-size:0.9em;color:var(--text-light);margin-bottom:6px}
.husband-fav{color:#E91E63;font-size:0.85em}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:0.75em;margin-left:6px}
.recipe-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;background:var(--bg);border-radius:4px;font-size:0.85em}
.recipe-tag i{font-style:normal;cursor:pointer;color:#999;margin-left:4px}
.recipe-tag i:hover{color:red}
.alert{padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:0.95em}
.alert-warning{background:#FFF3E0;color:#E65100;border-left:4px solid #FF9800}
.alert-success{background:#E8F5E9;color:#2E7D32;border-left:4px solid #4CAF50}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>家庭菜谱生成器</h1>
  </div>
  <div class="tabs">
    <div class="tab active" id="tab-gen" onclick="switchTab('generate')">生成菜谱</div>
    <div class="tab" id="tab-nut" onclick="switchTab('nutrition')">营养分析</div>
    <div class="tab" id="tab-shop" onclick="switchTab('shopping')">购物清单</div>
    <div class="tab" id="tab-set" onclick="switchTab('settings')">设置</div>
  </div>
  
  <div id="tab-generate">
    <div class="card">
      <h2>本周菜谱设置</h2>
      <div class="form-group">
        <label>开始日期（周一）</label>
        <input type="date" id="startDate">
      </div>
      <button class="btn" onclick="generateRecipe()">生成本周菜谱</button>
    </div>
    <div id="recipeResult"></div>
    <div id="recipeStats"></div>
  </div>
  
  <div id="tab-nutrition" style="display:none">
    <div class="card"><h2>每日营养摄入</h2><div id="nutritionResult"></div></div>
  </div>
  
  <div id="tab-shopping" style="display:none">
    <div class="card"><h2>本周采购清单</h2><div id="shoppingList"></div></div>
  </div>
  
  <div id="tab-settings" style="display:none">
    <div class="card">
      <h2>设置</h2>
      <div id="settingsForm"></div>
      <button class="btn" style="margin-top:15px" onclick="saveSettings()">保存设置</button>
    </div>
  </div>

// 加载食材数据
try{
  const stored=localStorage.getItem('ingredientsDB');
  if(stored)INGREDIENTS=JSON.parse(stored);

function saveIngredientsDB(){
  localStorage.setItem('ingredientsDB',JSON.stringify(INGREDIENTS));
}

function exportData(){
  const data={
    settings:settings,
    recipeDB:recipeDB,
    ingredients:INGREDIENTS,
    exportTime:new Date().toISOString()
  };
  const blob=new Blob([JSON.stringify(data, null, 2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`菜谱数据_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(){
  const input=document.createElement('input');
  input.type='file';
  input.accept='.json';
  input.onchange=async(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    try{
      const text=await file.text();
      const data=JSON.parse(text);
      if(data.settings){
        settings=data.settings;
        localStorage.setItem('recipeSettings',JSON.stringify(settings));
      }
      if(data.recipeDB){
        recipeDB=data.recipeDB;
        localStorage.setItem('recipeDB',JSON.stringify(recipeDB));
      }
      if(data.ingredients){
        INGREDIENTS=data.ingredients;
        localStorage.setItem('ingredientsDB',JSON.stringify(INGREDIENTS));
      }
      renderSettings();
      alert('数据导入成功！');
    }catch(err){
      alert('导入失败：'+err.message);
    }
  };
  input.click();
}

// 成人BMI计算
function calcAdultBMI(w,h){
  const b=w/Math.pow(h/100,2);
  return b<18.5?{v:b.toFixed(1),t:'偏瘦',c:'#FFC107'}:b<24?{v:b.toFixed(1),t:'标准',c:'#4CAF50'}:b<28?{v:b.toFixed(1),t:'偏胖',c:'#FF9800'}:{v:b.toFixed(1),t:'肥胖',c:'#f44336'};
}

// 儿童BMI计算（参考中国7-18岁儿童青少年BMI标准）
// 简化判断：按年龄分段
function calcChildBMI(age, weight, height, gender){
  const bmi = weight / Math.pow(height/100, 2);
  // 简化判断标准（实际应以国家发布标准表为准）
  let text, color;
  if(age<6){
    if(bmi<14){text='偏低';color='#FFC107';}
    else if(bmi<18){text='正常';color='#4CAF50';}
    else if(bmi<20){text='偏高';color='#FF9800';}
    else{text='肥胖';color='#f44336';}
  }else if(age<10){
    if(bmi<14.5){text='偏低';color='#FFC107';}
    else if(bmi<18.5){text='正常';color='#4CAF50';}
    else if(bmi<21){text='偏高';color='#FF9800';}
    else{text='肥胖';color='#f44336';}
  }else{
    if(bmi<16){text='偏低';color='#FFC107';}
    else if(bmi<23){text='正常';color='#4CAF50';}
    else if(bmi<25){text='偏高';color='#FF9800';}
    else{text='肥胖';color='#f44336';}
  }
  return {v:bmi.toFixed(1),t:text,c:color};
}

function calcProt(w,t){return Math.round(w*(t?1.2:0.8))}

// 孩子蛋白需求（中国居民膳食指南参考）
function calcChildProt(age, gender){
  // 11岁儿童参考摄入量约55g/天
  if(age<6)return 30;
  if(age<10)return 45;
  return 55;
}

function toggleCollapse(id){
  const c=document.getElementById(id+'-content');
  const i=document.getElementById(id+'-icon');
  c.classList.toggle('open');
  i.textContent=c.classList.contains('open')?'▲':'▼';
}

function toggleTraining(el,person,day){
  el.classList.toggle('checked');
}

function addHusbandFav(){
  const input=document.getElementById('newHusbandFav');
  const val=input.value.trim();
  if(val && !settings.husbandFavs.includes(val)){
    settings.husbandFavs.push(val);
    input.value='';
    renderSettings();
  }
}

function removeHusbandFav(food){
  settings.husbandFavs=settings.husbandFavs.filter(f=>f!==food);
  renderSettings();
}

function addRecipe(category){
  const idMap = {
    meat: ['newMeatMethod', 'newMeatMain'],
    seafood: ['newSeafoodMethod', 'newSeafoodMain'],
    leafy: ['newLeafyMethod', 'newLeafyMain'],
    reheat: ['newReheatMethod', 'newReheatMain']
  };
  const ids = idMap[category];
  const methodEl = document.getElementById(ids[0]);
  const mainEl = document.getElementById(ids[1]);
  const method = methodEl?.value.trim();
  const main = mainEl?.value.trim();
  if(!method||!main){
    alert('请输入菜名和主料');
    return;
  }
  const newRecipe={name:main,method:method,ingredients:[{name:main,qty:200}]};
  recipeDB[category].push(newRecipe);
  saveRecipeDB();
  renderSettings();
  if(methodEl)methodEl.value='';
  if(mainEl)mainEl.value='';
}

function removeRecipe(category,index){
  if(confirm('确定删除这道菜吗？')){
    recipeDB[category].splice(index,1);
    saveRecipeDB();
    renderSettings();
  }
}

function addIngredient(){
  const name=document.getElementById('newIngName')?.value.trim();
  const protein=parseFloat(document.getElementById('newIngProtein')?.value);
  const category=document.getElementById('newIngCategory')?.value;
  if(!name||!protein){
    alert('请输入食材名称和蛋白质含量');
    return;
  }
  INGREDIENTS[name]={protein,category};
  saveIngredientsDB();
  renderSettings();
  document.getElementById('newIngName').value='';
  document.getElementById('newIngProtein').value='';
}

function switchTab(tab){
  currentTab = tab;
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(t => t.classList.remove('active'));
  const targetId = 'tab-' + (tab === 'generate' ? 'gen' : tab === 'nutrition' ? 'nut' : tab === 'shopping' ? 'shop' : 'set');
  const targetTab = document.getElementById(targetId);
  if (targetTab) targetTab.classList.add('active');
  
  document.getElementById('tab-generate').style.display = tab === 'generate' ? 'block' : 'none';
  document.getElementById('tab-nutrition').style.display = tab === 'nutrition' ? 'block' : 'none';
  document.getElementById('tab-shopping').style.display = tab === 'shopping' ? 'block' : 'none';
  document.getElementById('tab-settings').style.display = tab === 'settings' ? 'block' : 'none';
  
  if (tab === 'settings') renderSettings();
  if (tab === 'nutrition' && weeklyRecipes.length > 0) renderNutrition();
  if (tab === 'shopping' && weeklyRecipes.length > 0) renderShoppingList();
}

function generateRecipe(){
  const d=document.getElementById('startDate').value?new Date(document.getElementById('startDate').value):new Date();
  const diff=d.getDay()===0?-6:1-d.getDay();
  d.setDate(d.getDate()+diff);
  d.setHours(0,0,0,0);
  weeklyRecipes=[];
  const used={meat:{},seafood:{},leafy:{},reheat:{},husbandVeg:{}};
  const husbandFavs=settings.husbandFavs||DEFAULT_HUSBAND_FAV;
  const husbandPref=settings.husbandFav;
  const husbandDiabetes=settings.husbandDiabetes;
  
  const meatRecipes = recipeDB.meat;
  const seafoodRecipes = recipeDB.seafood;
  const leafyRecipes = recipeDB.leafy;
  const reheatRecipes = recipeDB.reheat;
  
  const calcProtein=(ingredients)=>{
    return ingredients.reduce((sum,ing)=>sum+(INGREDIENTS[ing.name]?.protein||0)*ing.qty/100,0);
  };
  
  const getMainIngredients=(recipe)=>{
    return recipe.ingredients.map(ing=>ing.name);
  };
  
  const hasConflict=(mainIng,leafyIng,reheatIng)=>{
    const mainSet=new Set(mainIng);
    for(const ing of leafyIng){
      if(mainSet.has(ing))return true;
    }
    for(const ing of reheatIng){
      if(mainSet.has(ing))return true;
    }
    const leafySet=new Set(leafyIng);
    for(const ing of reheatIng){
      if(leafySet.has(ing))return true;
    }
    return false;
  };
  
  for(let i=0;i<7;i++){
    const cd=new Date(d);cd.setDate(d.getDate()+i);
    const dn=['日','一','二','三','四','五','六'][cd.getDay()];
    const dk=['sun','mon','tue','wed','thu','fri','sat'][cd.getDay()];
    const iw=settings.wifeTraining.includes(dk);
    const ih=settings.husbandTraining.includes(dk);
    const ic=settings.childTraining.includes(dk);
    
    const prevMeat=i>0?weeklyRecipes[i-1].dinner.mainProtein:'';
    const prevSeafood=i>0?weeklyRecipes[i-1].dinner.mainProtein:'';
    const prevLeafy=i>0?weeklyRecipes[i-1].dinner.leafy:'';
    const prevReheat=i>0?weeklyRecipes[i-1].dinner.reheat:'';
    const prevHusbandVeg=i>0?weeklyRecipes[i-1].dinner.leafySource:'';
    
    let prevHasEgg=false;
    if(i>0){
      const prev=weeklyRecipes[i-1].dinner;
      prevHasEgg=prev.mainProtein.includes('蛋')||prev.leafy.includes('蛋')||prev.reheat.includes('蛋');
    }
    
    const am=meatRecipes.filter(r=>{
      if(r.name==='羊肉'&&(used.meat['羊肉']||0)>=1)return false;
      if(r.method===prevMeat)return false;
      return(used.meat[r.name]||0)<2;
    });
    const meat=am.length>0?am[Math.floor(Math.random()*am.length)]:meatRecipes[0];
    used.meat[meat.name]=(used.meat[meat.name]||0)+1;
    
    const aseafood=seafoodRecipes.filter(r=>{
      if(r.method===prevSeafood)return false;
      return(used.seafood[r.name]||0)<1;
    });
    const useSeafood=aseafood.length>0&&Math.random()>0.7;
    const seafood=useSeafood?aseafood[Math.floor(Math.random()*aseafood.length)]:null;
    if(seafood)used.seafood[seafood.name]=(used.seafood[seafood.name]||0)+1;
    
    const mainProtein=useSeafood?seafood:meat;
    const mainProteinName=useSeafood?seafood.name:meat.name;
    
    let avh=leafyRecipes.filter(r=>!r.method.includes('蛋')&&r.name!==prevHusbandVeg&&(used.husbandVeg[r.name]||0)<2&&(!prevHasEgg||!r.method.includes('蛋')));
    if(husbandDiabetes){
      avh=avh.filter(r=>{
        const ingNames=r.ingredients.map(i=>i.name);
        return !ingNames.includes('土豆') && !ingNames.includes('南瓜');
      });
      const lg=avh.filter(r=>r.lowGI);
      if(lg.length)avh=lg;
    }
    if(husbandPref&&husbandFavs.length>0){
      const fv=avh.filter(r=>r.ingredients.some(ing=>husbandFavs.some(fav=>ing.name.includes(fav)||fav.includes(ing.name))));
      if(fv.length)avh=fv;
    }
    const husbandVeg=avh.length>0?avh[Math.floor(Math.random()*avh.length)]:leafyRecipes[0];
    used.husbandVeg[husbandVeg.name]=(used.husbandVeg[husbandVeg.name]||0)+1;
    
    let al=leafyRecipes.filter(r=>r.name!==husbandVeg.name&&!r.method.includes('蛋')&&r.method!==prevLeafy&&(used.leafy[r.name]||0)<2&&(!prevHasEgg||!r.method.includes('蛋')));
    if(husbandDiabetes){const lg=al.filter(r=>r.lowGI);if(lg.length)al=lg;}
    const leafy=al.length>0?al[Math.floor(Math.random()*al.length)]:leafyRecipes[0];
    used.leafy[leafy.name]=(used.leafy[leafy.name]||0)+1;
    
    let ar=reheatRecipes.filter(r=>r.name!==leafy.name&&r.name!==husbandVeg.name&&r.method!==prevReheat&&(used.reheat[r.name]||0)<2&&(!prevHasEgg||!r.method.includes('蛋')));
    if(husbandDiabetes){
      ar=ar.filter(r=>{
        const ingNames=r.ingredients.map(i=>i.name);
        return !ingNames.includes('土豆') && !ingNames.includes('南瓜');
      });
      const lg=ar.filter(r=>r.lowGI);
      if(lg.length)ar=lg;
    }
    const noEggReheat=reheatRecipes.filter(r=>!r.method.includes('蛋'));
    const reheat=ar.length>0?ar[Math.floor(Math.random()*ar.length)]:noEggReheat[Math.floor(Math.random()*noEggReheat.length)]||reheatRecipes[0];
    used.reheat[reheat.name]=(used.reheat[reheat.name]||0)+1;
    
    const mainIng=getMainIngredients(mainProtein);
    const leafyIng=getMainIngredients(leafy);
    const reheatIng=getMainIngredients(reheat);
    
    if(hasConflict(mainIng,leafyIng,reheatIng)){
      let bestReheat=reheat;
      const available=reheatRecipes.filter(r=>{
        const ri=getMainIngredients(r);
        return r.name!==leafy.name&&r.name!==husbandVeg.name&&r.method!==prevReheat&&(used.reheat[r.name]||0)<2&&!hasConflict(mainIng,leafyIng,ri);
      });
      if(available.length>0){
        used.reheat[reheat.name]=(used.reheat[reheat.name]||0)-1;
        bestReheat=available[Math.floor(Math.random()*available.length)];
        used.reheat[bestReheat.name]=(used.reheat[bestReheat.name]||0)+1;
      }
      Object.assign(reheat,bestReheat);
    }
    
    const wifeWeightKg=settings.wifeWeight||56.5;
    const husbandWeightKg=settings.husbandWeight||72.5;
    const childWeightKg=settings.childWeight||40;
    const wifeTotal=iw?Math.round(wifeWeightKg*1.2):Math.round(wifeWeightKg*0.7);
    const husbandTotal=ih?Math.round(husbandWeightKg*1.2):Math.round(husbandWeightKg*0.7);
    const childTotal=ic?Math.round(childWeightKg*1.2):Math.round(childWeightKg*0.8);
    
    const mainIngredients=mainProtein.ingredients;
    const leafyIngredients=leafy.ingredients;
    const reheatIngredients=reheat.ingredients;
    const mp=calcProtein(mainIngredients);
    const lp=calcProtein(leafyIngredients);
    const rp=calcProtein(reheatIngredients);
    
    const shrimpCountSoFar=weeklyRecipes.slice(0,i).filter(d=>d.dinner.shrimp&&d.dinner.shrimp.includes('北极冰虾')).length;
    const useShrimp=iw&&shrimpCountSoFar<2&&Math.random()>0.3;
    const sp=useShrimp?18:0;
    const totalDinnerProtein=mp+lp+rp+sp;
    
    const myDinner=totalDinnerProtein*0.4;
    const husbandDinner=totalDinnerProtein*0.35;
    const childDinner=totalDinnerProtein*0.25;
    
    const wifeBreakfast=15,husbandBreakfast=22,childBreakfast=15;
    const wifeLunch=Math.max(15,wifeTotal-wifeBreakfast-Math.round(myDinner));
    const husbandLunch=Math.max(15,husbandTotal-husbandBreakfast-Math.round(husbandDinner));
    const childLunch=Math.max(15,childTotal-childBreakfast-Math.round(childDinner));
    
    weeklyRecipes.push({
      date:cd,dayName:dn,dayKey:dk,
      isWifeTraining:iw,isHusbandTraining:ih,isChildTraining:ic,
      dinner:{
        mainProtein:useSeafood?seafood.method:meat.method,
        mainProteinName:mainProteinName,
        mainProteinSource:useSeafood?'🐟':'🥩',
        mainProteinGrams:Math.round(mp),
        leafy:leafy.method,
        leafySource:leafy.name,
        leafyProteinGrams:Math.round(lp),
        reheat:reheat.method,
        reheatProtein:Math.round(rp),
        shrimp:useShrimp?'北极冰虾 100g（娃妈专属）':null,
        shrimpProtein:sp,
        totalProtein:Math.round(totalDinnerProtein),
        mainIngredients:mainIngredients,
        leafyIngredients:leafyIngredients,
        reheatIngredients:reheatIngredients,
        wifeLunch:Math.round(wifeLunch),
        husbandLunch:Math.round(husbandLunch),
        childLunch:Math.round(childLunch),
        myDinner:Math.round(myDinner),
        husbandDinner:Math.round(husbandDinner),
        childDinner:Math.round(childDinner),
        wifeTotalIntake:wifeBreakfast+Math.round(wifeLunch)+Math.round(myDinner),
        husbandTotalIntake:husbandBreakfast+Math.round(husbandLunch)+Math.round(husbandDinner),
        childTotalIntake:childBreakfast+Math.round(childLunch)+Math.round(childDinner),
        wifeProteinNeed:wifeTotal,
        husbandProteinNeed:husbandTotal,
        childProteinNeed:childTotal,
        wifeMet:wifeBreakfast+wifeLunch+myDinner>=wifeTotal,
        husbandMet:husbandBreakfast+husbandLunch+husbandDinner>=husbandTotal,
        childMet:childBreakfast+childLunch+childDinner>=childTotal,
      },
      lunch:{meat:mainProteinName,method:mainProtein.method,veg:reheat.method}
    });
  }
  renderRecipe();renderShoppingList();renderNutrition();
}

function renderShoppingList(){
  let html='';
  weeklyRecipes.forEach(day=>{
    const ds=`${day.date.getMonth()+1}月${day.date.getDate()}日`;
    const dn=day.dayName;
    const items={};
    day.dinner.mainIngredients.forEach(i=>items[i.name]=(items[i.name]||0)+i.qty);
    day.dinner.leafyIngredients.forEach(i=>items[i.name]=(items[i.name]||0)+i.qty);
    day.dinner.reheatIngredients.forEach(i=>items[i.name]=(items[i.name]||0)+i.qty);
    if(day.dinner.shrimp)items['北极冰虾']=(items['北极冰虾']||0)+100;
    const cats={meat:[],veg:[],prot:[]};
    for(const[n,q]of Object.entries(items)){
      const c=INGREDIENTS[n]?.category;
      if(c==='meat'||c==='seafood')cats.meat.push({n,q});
      else if(c==='egg'||c==='tofu')cats.prot.push({n,q});
      else cats.veg.push({n,q});
    }
    html+=`<div class="shopping-category"><h3>📅 ${ds} 周${dn}</h3>`;
    if(cats.meat.length){cats.meat.forEach(i=>html+=`<div class="shopping-item"><span>${i.n}</span><span>${i.q}g</span></div>`);}
    if(cats.veg.length){cats.veg.forEach(i=>html+=`<div class="shopping-item"><span>${i.n}</span><span>${i.q}g</span></div>`);}
    if(cats.prot.length){cats.prot.forEach(i=>html+=`<div class="shopping-item"><span>${i.n}</span><span>${i.q}g</span></div>`);}
    html+='</div>';
  });
  document.getElementById('shoppingList').innerHTML=html;
}

        <div style="font-size:0.75em;color:#666">日均全家</div>
      </div>
      <div style="background:#fce4ec;padding:16px;border-radius:8px;text-align:center">
        <div style="font-size:0.8em;color:#C2185B;margin-bottom:4px">晚餐（生成）</div>
        <div style="font-size:1.3em;font-weight:700;color:#C2185B">${Math.round(dinnerProtein/7)}g</div>
        <div style="font-size:0.75em;color:#666">日均全家</div>
      </div>
    </div>
    
    <div class="nutrition-stat" style="background:#f8f9fa">
      <div class="nutrition-item">
        <div class="value" style="color:#4CAF50">${avgDaily.family.protein}g</div>
        <div class="label">全家日均蛋白</div>
      </div>
      <div class="nutrition-item">
        <div class="value" style="color:#4CAF50">${avgDaily.family.calorie}</div>
        <div class="label">全家日均热量</div>
      </div>
      <div class="nutrition-item">
        <div class="value">${trainingDays}天</div>
        <div class="label">训练日</div>
      </div>
    </div>
    
    <div style="margin-top:16px">
      <div style="font-size:0.9em;color:var(--text-light);margin-bottom:12px">📊 人均日均（全家÷3）vs 推荐值</div>
      <div class="nutrition-stat" style="background:#fff3e0">
        <div class="nutrition-item">
          <div class="value" style="color:#E91E63">${avgDaily.perPerson.protein}g</div>
          <div class="label">人均蛋白</div>
        </div>
        <div class="nutrition-item">
          <div class="value" style="color:#E91E63">${avgDaily.perPerson.calorie}</div>
          <div class="label">人均热量</div>
        </div>
      </div>
    </div>
    
    <div style="margin-top:16px;padding:12px;background:#f8f9fa;border-radius:8px">
      <div style="font-size:0.85em;color:#666;margin-bottom:10px">📋 营养学推荐（基于当前设置）</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div style="padding:10px;background:#e3f2fd;border-radius:6px">
          <div style="font-weight:600;color:#1565C0;margin-bottom:4px">👩👨 成人推荐</div>
          <div style="font-size:0.85em;color:#666">热量: 1600-1800 kcal</div>
          <div style="font-size:0.85em;color:#666">蛋白: ${wifeProteinRest}-${wifeProteinTrain}g</div>
        </div>
        <div style="padding:10px;background:#fff3e0;border-radius:6px">
          <div style="font-weight:600;color:#E65100;margin-bottom:4px">👧 孩子推荐（${settings.childAge||11}岁）</div>
          <div style="font-size:0.85em;color:#666">热量: 1800-2000 kcal</div>
          <div style="font-size:0.85em;color:#666">蛋白: 50-60g</div>
        </div>
      </div>
    </div>
    
    <div class="alert ${avgDaily.perPerson.protein>=50?'alert-success':'alert-warning'}" style="margin-top:16px">
      ${avgDaily.perPerson.protein>=50?'✓ 人均蛋白摄入达标':'⚠ 人均蛋白略低，建议增加肉蛋类'}
    </div>
  `;
}

document.addEventListener('DOMContentLoaded',()=>{const t=new Date();const d=t.getDay()===0?6:t.getDay()-1;const m=new Date(t);m.setDate(t.getDate()-d);document.getElementById('startDate').value=m.toISOString().split('T')[0]});
</script>
</body>
</html>
